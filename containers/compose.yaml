services:
  podllama_chat:
    image: podllama-server:latest
    container_name: podllama_chat
    environment:
      - MODEL_ROLE=chat
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${MODELS_DIR:-../models}:/models:z
      - ../config/model_conf.yaml:/app/config/model_conf.yaml:ro,z
    mem_limit: 16g
    mem_reservation: 4g
    cpus: "8.0"
    restart: unless-stopped

  podllama_autocomplete:
    image: podllama-server:latest
    container_name: podllama_autocomplete
    environment:
      - MODEL_ROLE=autocomplete
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${MODELS_DIR:-../models}:/models:z
      - ../config/model_conf.yaml:/app/config/model_conf.yaml:ro,z
    mem_limit: 4g
    mem_reservation: 1g
    cpus: "2.0"
    restart: unless-stopped

  podllama_proxy:
    image: podllama-litellm:latest
    container_name: podllama_proxy
    ports:
      - "4000:4000"
    volumes:
      - ../config/litellm_config.yaml:/app/config.yaml:ro,Z
    depends_on:
      - podllama_chat
      - podllama_autocomplete
    mem_limit: 1g
    restart: unless-stopped
