services:
  qwen_server_chat:
    image: qwen-server:latest
    container_name: qwen_server_chat
    environment:
      - MODEL_ROLE=chat
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${MODELS_DIR:-../models}:/models:z
      - ../config/model_conf.yaml:/app/config/model_conf.yaml:ro,Z
    mem_limit: 16g
    mem_reservation: 4g
    cpus: "8.0"
    restart: unless-stopped

  qwen_server_autocomplete:
    image: qwen-server:latest
    container_name: qwen_server_autocomplete
    environment:
      - MODEL_ROLE=autocomplete
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${MODELS_DIR:-../models}:/models:z
      - ../config/model_conf.yaml:/app/config/model_conf.yaml:ro,Z
    mem_limit: 4g
    mem_reservation: 1g
    cpus: "2.0"
    restart: unless-stopped

  litellm_proxy:
    image: qwen-litellm:latest
    container_name: litellm_proxy
    ports:
      - "4000:4000"
    volumes:
      - ../config/litellm_config.yaml:/app/config.yaml:ro,Z
    depends_on:
      - qwen_server_chat
      - qwen_server_autocomplete
    mem_limit: 1g
    restart: unless-stopped
