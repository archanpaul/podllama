<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="podGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#39c5cf" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="60" cy="60" r="50" fill="url(#podGlow)" opacity="0.12" filter="url(#glowEffect)" />

  <!-- Outer Pod / Container Boundary -->
  <rect x="15" y="18" width="90" height="64" rx="14" ry="14" stroke="url(#podGlow)" stroke-width="3" fill="#161b22" />
  
  <!-- Inner Terminal Screen -->
  <rect x="22" y="25" width="76" height="50" rx="8" ry="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Top Bar Window Controls -->
  <circle cx="31" cy="33" r="2.5" fill="#f85149" />
  <circle cx="38" cy="33" r="2.5" fill="#e3b341" />
  <circle cx="45" cy="33" r="2.5" fill="#56d364" />
  <line x1="22" y1="40" x2="98" y2="40" stroke="#21262d" stroke-width="1" />

  <!-- Code Bracket Monogram & AI Spark -->
  <path d="M 40 48 L 33 54 L 40 60" stroke="#79c0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="53" y1="46" x2="47" y2="62" stroke="#39c5cf" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 60 48 L 67 54 L 60 60" stroke="#79c0ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Base Stand Neck & Footplate -->
  <path d="M 50 82 L 50 96 M 70 82 L 70 96" stroke="url(#podGlow)" stroke-width="3" stroke-linecap="round" />
  <rect x="36" y="96" width="48" height="6" rx="3" fill="#21262d" stroke="url(#podGlow)" stroke-width="2" />

  <!-- Hardware / Privacy Security Badge (Shield Overlap) -->
  <g transform="translate(74, 56)">
    <circle cx="16" cy="16" r="15" fill="#161b22" stroke="url(#podGlow)" stroke-width="2.5" />
    <circle cx="16" cy="16" r="12" fill="url(#shieldGrad)" />
    <!-- AI Sparkle Icon -->
    <path d="M 16 7 C 16 12 19 16 25 16 C 19 16 16 20 16 25 C 16 20 13 16 7 16 C 13 16 16 12 16 7 Z" fill="#ffffff" />
  </g>
</svg>