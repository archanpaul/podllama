# Continue Extension Configuration (config.yaml)
# Place this file at ~/.continue/config.yaml or .continue/config.yaml

models:
  - name: PodLlama Chat (Local Vulkan)
    title: PodLlama Chat (Local Vulkan)
    provider: openai
    model: podllama-chat
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    contextLength: 16384
    roles:
      - chat
      - edit

  - name: PodLlama Thinking (Local Vulkan)
    title: PodLlama Thinking (Local Vulkan)
    provider: openai
    model: podllama-thinking
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    contextLength: 16384
    roles:
      - chat

  - name: PodLlama Autocomplete (Local Vulkan)
    title: PodLlama Autocomplete (Local Vulkan)
    provider: openai
    model: podllama-autocomplete
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    roles:
      - autocomplete

tabAutocompleteModel:
  title: PodLlama Autocomplete (Local Vulkan)
  provider: openai
  model: podllama-autocomplete
  apiBase: http://localhost:4000/v1
  apiKey: sk-local

contextProviders:
  - name: code
  - name: docs
  - name: diff
  - name: terminal
  - name: folder
