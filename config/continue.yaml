# Continue Extension Configuration (config.yaml)
# Place this file at ~/.continue/config.yaml or .continue/config.yaml

name: PodLlama Local (Vulkan GPU Accelerated)
version: 0.0.1
schema: v1

models:
  - name: PodLlama Chat (Local Vulkan)
    provider: openai
    model: podllama-chat
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    contextLength: 16384
    roles:
      - chat
      - edit

  - name: PodLlama Thinking (Local Vulkan)
    provider: openai
    model: podllama-thinking
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    contextLength: 16384
    roles:
      - chat

  - name: Qwen Autocomplete (Local Vulkan)
    provider: openai
    model: podllama-autocomplete
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    roles:
      - autocomplete
    promptTemplates:
      autocomplete: "<|fim_prefix|>{{{prefix}}}<|fim_suffix|>{{{suffix}}}<|fim_middle|>"

contextProviders:
  - name: code
  - name: docs
  - name: diff
  - name: terminal
  - name: folder
