name: PodLlama Local (Vulkan GPU Accelerated)
version: 0.0.1
schema: v1

models:
  - name: PodLlama Chat (Local Vulkan)
    provider: openai
    model: podllama-chat
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    contextLength: 16384
    roles:
      - chat
      - edit

  - name: PodLlama Thinking (Local Vulkan)
    provider: openai
    model: podllama-thinking
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    contextLength: 16384
    roles:
      - chat

  - name: PodLlama Autocomplete (Local Vulkan)
    provider: openai
    model: podllama-autocomplete
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    useLegacyCompletionsEndpoint: true
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
      modelTimeout: 5000
      prefixPercentage: 0.8
      maxSuffixPercentage: 0.2

tabAutocompleteModel:
  title: PodLlama Autocomplete (Local Vulkan)
  provider: openai
  model: podllama-autocomplete
  apiBase: http://localhost:4000/v1
  apiKey: sk-local
  template: fim

contextProviders:
  - name: code
  - name: docs
  - name: diff
  - name: terminal
  - name: folder
