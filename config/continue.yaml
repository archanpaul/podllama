# Continue Extension Configuration (config.yaml)
# Place this file at ~/.continue/config.yaml or .continue/config.yaml

name: Qwen Code Local (Vulkan GPU Accelerated)
version: 0.0.1
schema: v1

models:
  - name: Qwen Chat (Local Vulkan)
    provider: openai
    model: qwen-chat
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    contextLength: 16384
    roles:
      - chat
      - edit

  - name: Qwen Autocomplete (Local Vulkan)
    provider: openai
    model: qwen-autocomplete
    apiBase: http://localhost:4000/v1
    apiKey: sk-local
    roles:
      - autocomplete

contextProviders:
  - name: code
  - name: docs
  - name: diff
  - name: terminal
  - name: folder
