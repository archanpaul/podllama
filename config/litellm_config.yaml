general_settings:
  master_key: sk-local
  disable_master_key_auth: true

router_settings:
  num_retries: 0
  timeout: 120

litellm_settings:
  max_tokens: 65536
  max_input_tokens: 65536
  truncate_input_tokens: true
  drop_params: true
