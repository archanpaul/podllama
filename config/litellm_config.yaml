model_list:
  # Primary Role Aliases
  - model_name: podllama-chat
    litellm_params:
      model: openai/qwen2.5-coder
      api_base: http://podllama_chat:8080/v1
      api_key: sk-local
      drop_params: true
      # Force grammar-constrained tool calling so llama-server parses
      # <tool_call> tags into proper tool_calls objects. Without this,
      # Qwen2.5-Coder outputs non-standard XML that llama-server cannot
      # parse, causing tool calls to be returned as plain text content.
      tool_choice: required

  - model_name: podllama-autocomplete
    litellm_params:
      model: openai/podllama-autocomplete
      api_base: http://podllama_autocomplete:8081/v1
      api_key: sk-local
      drop_params: true

  - model_name: podllama-thinking
    litellm_params:
      model: openai/qwen2.5-coder
      api_base: http://podllama_chat:8080/v1
      api_key: sk-local
      drop_params: true
      # Same tool_choice fix as podllama-chat (same backend model)
      tool_choice: required

  # Available Backend GGUF Models for Direct Auto-Swapping
  - model_name: qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
