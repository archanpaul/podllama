<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Thin outline of a computer monitor -->
  <!-- Screen bezel frame -->
  <rect x="12" y="15" width="76" height="52" rx="4" ry="4" stroke-width="3.5"></rect>
  <!-- Inner screen boundary -->
  <rect x="18" y="21" width="64" height="40" rx="1" ry="1" opacity="0.6" stroke-width="2"></rect>
  <!-- Stand neck -->
  <path d="M 42,67 Q 42,78 30,79 M 58,67 Q 58,78 70,79" stroke-width="3.5"></path>
  <!-- Stand base -->
  <line x1="30" y1="79" x2="70" y2="79" stroke-width="4.5"></line>

  <!-- Center code symbols </> -->
  <path d="M 37,36 L 29,41 L 37,46" stroke-width="2.5"></path>
  <line x1="46" y1="33" x2="52" y2="49" stroke-width="2.5"></line>
  <path d="M 61,36 L 69,41 L 61,46" stroke-width="2.5"></path>

  <!-- Circular background shield for AI Sparkle Badge to overlap bezel -->
  <circle cx="72" cy="54" r="14" fill="var(--vscode-sideBar-background, #1e1e1e)" stroke="currentColor" stroke-width="3"></circle>

  <!-- AI Sparkle star inside bottom right badge -->
  <path d="M 72,44 C 72,49 74,54 79,54 C 74,54 72,59 72,64 C 72,59 70,54 65,54 C 70,54 72,49 72,44 Z" fill="currentColor" stroke="none"></path>
</svg>
