<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Thin outline of a computer monitor -->
  <!-- Screen bezel frame -->
  <rect x="12" y="15" width="76" height="52" rx="4" ry="4" stroke-width="3.5"></rect>
  <!-- Inner screen boundary -->
  <rect x="18" y="21" width="64" height="40" rx="1" ry="1" opacity="0.6" stroke-width="2"></rect>
  <!-- Stand neck -->
  <path d="M 42,67 Q 42,78 30,79 M 58,67 Q 58,78 70,79" stroke-width="3.5"></path>
  <!-- Stand base -->
  <line x1="30" y1="79" x2="70" y2="79" stroke-width="4.5"></line>

  <!-- Circular background shield for AI Brain Badge to overlap bezel nicely -->
  <circle cx="70" cy="53" r="16" fill="var(--vscode-sideBar-background, #1e1e1e)" stroke="currentColor" stroke-width="3"></circle>

  <!-- Minimalist AI Brain Node network inside the badge -->
  <circle cx="70" cy="53" r="3.2" fill="currentColor"></circle>
  <line x1="70" y1="53" x2="70" y2="43" stroke-width="1.8"></line>
  <line x1="70" y1="53" x2="70" y2="63" stroke-width="1.8"></line>
  <line x1="70" y1="53" x2="60" y2="53" stroke-width="1.8"></line>
  <line x1="70" y1="53" x2="80" y2="53" stroke-width="1.8"></line>
  <line x1="70" y1="53" x2="63" y2="46" stroke-width="1.8"></line>
  <line x1="70" y1="53" x2="77" y2="46" stroke-width="1.8"></line>
  <line x1="70" y1="53" x2="63" y2="60" stroke-width="1.8"></line>
  <line x1="70" y1="53" x2="77" y2="60" stroke-width="1.8"></line>
  
  <circle cx="70" cy="43" r="1.2" fill="currentColor"></circle>
  <circle cx="70" cy="63" r="1.2" fill="currentColor"></circle>
  <circle cx="60" cy="53" r="1.2" fill="currentColor"></circle>
  <circle cx="80" cy="53" r="1.2" fill="currentColor"></circle>
  <circle cx="63" cy="46" r="1.2" fill="currentColor"></circle>
  <circle cx="77" cy="46" r="1.2" fill="currentColor"></circle>
  <circle cx="63" cy="60" r="1.2" fill="currentColor"></circle>
  <circle cx="77" cy="60" r="1.2" fill="currentColor"></circle>
</svg>
